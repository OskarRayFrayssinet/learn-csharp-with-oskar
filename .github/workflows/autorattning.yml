name: Autorättning

# Körs när en elev pushar till sin fork.
# I lärarens original hoppas den över, så att originalet inte visar rött kryss
# (där är ju uppgifterna inte lösta). Läraren kan ändå starta den manuellt
# under fliken Actions -> Autorättning -> Run workflow.
#
# Grenen 'dashboard' skrivs av den här workflowen och ignoreras, så att
# den inte startar sig själv.
on:
  push:
    branches-ignore:
      - dashboard
  workflow_dispatch:

# Behövs för att kunna skriva elevens dashboard till grenen 'dashboard'.
permissions:
  contents: write

jobs:
  testa:
    if: github.event.repository.fork || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Hämta koden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # hela historiken och alla taggar (behövs i övning 06)

      - name: Installera .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Kör testerna
        run: >
          dotnet test learn-csharp-with-oskar.sln
          --logger trx
          --logger "console;verbosity=normal"
          --results-directory testresultat
          2>&1 | tee testlogg.txt

      - name: Skriv sammanfattning
        if: always()
        run: python3 .github/scripts/sammanfattning.py testresultat >> "$GITHUB_STEP_SUMMARY"

      - name: Kodgranskning (tips, påverkar inte rättningen)
        if: always()
        run: python3 .github/scripts/kodgranskning.py testlogg.txt kodtips.json

      - name: Uppdatera min dashboard
        if: always() && github.event.repository.fork
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/dashboard.sh
